name: raiz_app
description: "Raíz — detección temprana de riesgo de dislexia y disgrafía en escuelas rurales, offline-first."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2

  # Módulo 1 — OCR (offline con ML Kit)
  google_mlkit_text_recognition: ^0.17.1
  http: ^1.2.2

  # Módulo 2 — foto de la escritura + análisis de imagen
  image_picker: ^1.1.2
  image: ^4.2.0
  tflite_flutter: ^0.12.1        # clasificador de letras en espejo (on-device)

  # Módulo 3 — historial local
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  fl_chart: ^0.69.0

  # Utilidades
  connectivity_plus: ^7.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/
